<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JY's ASMR</title>
    <link rel="stylesheet" href="style.css">
</head>    
<body>
<header class="page-header">
    <div class="container">
        <div class="header-top">
            <h1 class="site-title">JY's ASMR</h1>
            <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-label="菜单">☰</button>
        </div>
        <div class="header-actions" id="headerActions">
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="输入视频名称或标签搜索..."
                    autocomplete="off">
                
                <!-- 标签筛选区域 -->
                <div class="tag-filter" id="tagFilter">
                    <div class="tag-primary" id="tagPrimary"></div>
                    <div class="tag-secondary-wrap" id="tagSecondaryWrap" style="display:none">
                        <div class="tag-secondary" id="tagSecondary"></div>
                    </div>
                </div>
            </div>

            <!-- 排序选择 -->
            <div class="sort-group">
                <select id="sort-select">
                    <option value="date-desc">📅 最新优先</option>
                    <option value="date-asc">📅 最早优先</option>
                    <option value="random">🎲 随机</option>
                </select>
            </div>

            <button id="premiumFilterBtn" class="filter-btn">⚡ 充电专属</button>
            <button id="liveReplayBtn" class="filter-btn">📺 直播回放</button>

            <!-- 时长筛选 -->
            <div class="duration-filter" id="durationFilter">
                <button class="dur-btn" data-dur="short">⚡ 短视频</button>
                <button class="dur-btn" data-dur="medium">☕ 中等</button>
                <button class="dur-btn" data-dur="long">🌙 长视频</button>
                <button class="dur-btn" data-dur="xlong">🕐 超长</button>
            </div>

            <button id="randomBtn" class="random-btn">🎲 睡前抽一个</button>
        </div>
    </div>
</header>

    <main class="page-main">
        <div class="container">
            <!-- 统计栏 -->
            <div id="stats-bar" class="stats-bar">
                <span id="stats-text">正在加载视频数据...</span>
            </div>

            <div id="statusTip" class="status-tip">正在加载视频数据...</div>
            <div id="videoGrid" class="video-grid"></div>
            <!-- 分页控件 -->
            <div id="pagination" class="pagination" style="display: none;"></div>
        </div>
    </main>

    <!-- 随机视频弹窗 -->
    <div id="randomModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-close" id="modalClose">×</div>
            <div class="modal-header">✨ 为你挑选的睡前视频</div>
            <div id="modalVideoCover" class="modal-cover"></div>
            <div id="modalVideoTitle" class="modal-title"></div>
            <div class="modal-actions">
                <button id="reRandomBtn" class="btn-secondary">🔄 再抽一个</button>
                <button id="watchInSiteBtn" class="btn-secondary">📺 站内播放</button>
                <button id="goWatchBtn" class="btn-primary">▶️ 跳转B站</button>
            </div>
        </div>
    </div>

    <!-- B站视频播放弹框 -->
    <div id="videoModal" class="video-modal-overlay" style="display: none;">
        <div class="video-modal-content">
            <div class="video-modal-close" id="videoModalClose">×</div>
            <div class="video-modal-header" id="videoModalTitle">视频标题</div>
            <div class="video-player-wrapper">
               <iframe 
                    id="bilibiliPlayer" 
                    src="" 
                    frameborder="0" 
                    allow="autoplay; fullscreen"
                    scrolling="no"
                ></iframe>
            </div>
            <div class="video-modal-tip">点击空白处关闭弹框 | 右下角可全屏播放</div>
        </div>
    </div>

    <footer class="page-footer">
        <div class="container">
            <p>© JY's ASMR | 基于GitHub Pages构建</p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
