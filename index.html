<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JY's ASMR · 睡前选片台</title>
    <meta name="description" content="JY's ASMR 助眠视频选片库。按触发音、时长、标签筛选，一键随机抽选，今晚听什么不再纠结。">
    <meta property="og:title" content="JY's ASMR · 睡前选片台">
    <meta property="og:description" content="按触发音、时长、标签筛选助眠视频，一键随机抽选。">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0c10">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ========== 顶部导航 ========== -->
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="./">
            <span class="brand-mark">🌙</span>
            <span class="brand-text">JY's ASMR</span>
            <span class="brand-sub">睡前选片台</span>
        </a>

        <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <input id="searchInput" type="search" placeholder="搜索视频名称或标签…" autocomplete="off" />
        </div>

        <div class="topbar-actions">
            <div class="theme-seg" id="themeToggle" role="group" aria-label="主题切换">
                <button class="theme-opt" data-theme-val="dark" title="暗色">🌙 暗色</button>
                <button class="theme-opt" data-theme-val="dim" title="夜深">🌘 夜深</button>
                <button class="theme-opt" data-theme-val="light" title="浅色">☀️ 浅色</button>
            </div>
            <button id="guideBtn" class="secondary-btn">✨ 今晚听什么</button>
            <button id="randomBtn" class="primary-btn">🎲 随机抽一个</button>
        </div>
    </div>
</header>

<!-- ========== 筛选区 ========== -->
<section class="filters" id="filtersSection" aria-label="筛选">
    <div class="filters-bar">
        <button id="filtersToggle" class="filters-toggle" aria-expanded="true">
            <span class="filters-toggle-icon">▾</span>
            <span class="filters-toggle-text">筛选条件</span>
            <span id="filtersCount" class="filters-count"></span>
        </button>
    </div>
    <div class="filters-inner" id="filtersInner">

        <!-- 来源 -->
        <div class="filter-row">
            <span class="filter-label">来源</span>
            <div class="chip-group" id="sourceFilter">
                <button class="chip active" data-src="all">全部</button>
                <button class="chip" data-src="bilibili">B站</button>
                <button class="chip" data-src="youtube">YouTube</button>
            </div>
        </div>

        <!-- 时长 -->
        <div class="filter-row">
            <span class="filter-label">时长</span>
            <div class="chip-group" id="durationFilter">
                <button class="chip" data-dur="short">⚡ &lt;5 分钟</button>
                <button class="chip" data-dur="medium">☕ 5–20 分钟</button>
                <button class="chip" data-dur="long">🌙 20–60 分钟</button>
                <button class="chip" data-dur="xlong">🕐 &gt;1 小时</button>
            </div>
        </div>

        <!-- 类型 -->
        <div class="filter-row">
            <span class="filter-label">类型</span>
            <div class="chip-group">
                <button id="premiumFilterBtn" class="chip">⚡ 充电专属</button>
                <button id="liveReplayBtn" class="chip">📺 直播回放</button>
            </div>
        </div>

        <!-- 我的 -->
        <div class="filter-row">
            <span class="filter-label">我的</span>
            <div class="chip-group" id="personalFilter">
                <button id="favOnlyBtn" class="chip">⭐ 收藏</button>
                <button id="historyOnlyBtn" class="chip">🕘 最近看过</button>
                <button id="playlistBtn" class="chip">📋 今晚序列 <em id="playlistCount">0</em></button>
                <button id="clearHistoryBtn" class="chip ghost" style="display:none">清空历史</button>
            </div>
        </div>

        <!-- 数据同步 -->
        <div class="filter-row">
            <span class="filter-label">同步</span>
            <div class="chip-group">
                <button id="exportBtn" class="chip ghost">⬇ 导出数据</button>
                <button id="importBtn" class="chip ghost">⬆ 导入数据</button>
                <button id="syncCodeBtn" class="chip ghost">🔑 同步码</button>
                <input id="syncCodeInput" type="text" class="sync-input" placeholder="输入同步码后点恢复" maxlength="32" />
                <button id="applySyncBtn" class="chip ghost">恢复</button>
                <span id="syncStatus" class="sync-status"></span>
            </div>
        </div>

        <!-- 排序 + 标签入口 -->
        <div class="filter-row">
            <span class="filter-label">排序</span>
            <div class="chip-group">
                <select id="sort-select" class="sort-select">
                    <option value="date-desc">最新优先</option>
                    <option value="date-asc">最早优先</option>
                    <option value="random">随机</option>
                </select>
                <button id="seriesBtn" class="chip ghost">📚 系列合集</button>
                <button id="tagFilterToggle" class="chip ghost">🏷️ 标签筛选</button>
            </div>
        </div>

        <!-- 标签（默认折叠） -->
        <div class="tag-panel" id="tagFilter" hidden>
            <div class="tag-primary" id="tagPrimary"></div>
            <div class="tag-secondary-wrap" id="tagSecondaryWrap">
                <div class="tag-secondary" id="tagSecondary"></div>
            </div>
        </div>

    </div>
</section>

<!-- ========== 主内容 ========== -->
<main class="main">
    <div class="main-inner">

        <div class="list-header">
            <h2 class="list-title">视频库</h2>
            <div class="list-meta">
                <span id="stats-text" class="stats-text">正在加载…</span>
            </div>
        </div>

        <div id="statusTip" class="status-tip">正在加载视频数据…</div>
        <div id="videoGrid" class="video-grid"></div>
        <nav id="pagination" class="pagination" style="display:none" aria-label="分页"></nav>

    </div>
</main>

<!-- ========== 页脚 ========== -->
<footer class="footer">
    <div class="footer-inner">
        <p>© JY's ASMR · 粉丝选片台 · 视频来源
            <a href="https://space.bilibili.com/176647698" target="_blank" rel="noopener">B站</a> ·
            <a href="https://www.youtube.com/@JYs_ASMR" target="_blank" rel="noopener">YouTube</a>
        </p>
        <p class="footer-note">本站不存储视频，播放均跳转至原平台。</p>
    </div>
</footer>

<!-- ========== 引导选片弹窗：今晚听什么 ========== -->
<div id="guideModal" class="modal-overlay" style="display:none">
    <div class="modal-card guide-card">
        <button class="modal-close" id="guideClose" aria-label="关闭">×</button>
        <div class="modal-header">✨ 今晚听什么</div>
        <div class="guide-subtitle" id="guideSubtitle">三步帮你挑一个，选择困难退散</div>

        <!-- 步骤 1：时长 -->
        <div class="guide-step" data-step="1">
            <div class="guide-q">今晚想听多久？</div>
            <div class="guide-options" id="guideDuration">
                <button class="guide-opt" data-val="short">⚡ 不到 5 分钟<br><em>快速助眠</em></button>
                <button class="guide-opt" data-val="medium">☕ 5–20 分钟<br><em>刚好入睡</em></button>
                <button class="guide-opt" data-val="long">🌙 20–60 分钟<br><em>慢慢放松</em></button>
                <button class="guide-opt" data-val="xlong">🕐 1 小时以上<br><em>整夜陪伴</em></button>
            </div>
        </div>

        <!-- 步骤 2：氛围 -->
        <div class="guide-step" data-step="2" hidden>
            <div class="guide-q">今晚的心情？</div>
            <div class="guide-options" id="guideMood">
                <button class="guide-opt" data-val="relax">🧘 放松助眠<br><em>轻语、按摩、头疗</em></button>
                <button class="guide-opt" data-val="focus">🎯 专注/清醒<br><em>专注力测试、指令</em></button>
                <button class="guide-opt" data-val="asmr">🎵 触发音<br><em>敲击、口腔、采耳</em></button>
                <button class="guide-opt" data-val="any">🎲 都行<br><em>不限</em></button>
            </div>
        </div>

        <!-- 步骤 3：人声 -->
        <div class="guide-step" data-step="3" hidden>
            <div class="guide-q">要不要人声？</div>
            <div class="guide-options" id="guideVoice">
                <button class="guide-opt" data-val="talk">🗣 有人声<br><em>轻语、对话、耳语</em></button>
                <button class="guide-opt" data-val="notalk">🤫 无对话<br><em>纯触发音</em></button>
                <button class="guide-opt" data-val="any">🎲 都行<br><em>不限</em></button>
            </div>
        </div>

        <!-- 结果 -->
        <div class="guide-step" data-step="4" hidden>
            <div class="guide-q">为你挑选的睡前视频</div>
            <div id="guideResult" class="guide-result"></div>
        </div>

        <div class="guide-footer">
            <button id="guideBack" class="btn-ghost sm" hidden>← 上一步</button>
            <span class="guide-progress" id="guideProgress">第 1 / 3 步</span>
            <button id="guideAgain" class="btn-ghost sm" hidden>🔄 再挑一个</button>
        </div>
    </div>
</div>

<!-- ========== 系列合集抽屉 ========== -->
<div id="seriesDrawer" class="drawer-overlay" style="display:none">
    <aside class="drawer">
        <header class="drawer-header">
            <h2>📚 系列合集</h2>
            <div class="drawer-actions">
                <button id="seriesCloseBtn" class="btn-ghost sm">✕</button>
            </div>
        </header>
        <div id="seriesList" class="drawer-body"></div>
        <footer class="drawer-tip">按内容自动聚合 · 点击系列名筛选</footer>
    </aside>
</div>

<!-- ========== 随机抽选弹窗 ========== -->
<div id="randomModal" class="modal-overlay" style="display:none">
    <div class="modal-card">
        <button class="modal-close" id="modalClose" aria-label="关闭">×</button>
        <div class="modal-header">✨ 为你挑选的睡前视频</div>
        <div id="modalVideoCover" class="modal-cover"></div>
        <div id="modalVideoTitle" class="modal-title"></div>
        <div id="modalVideoSource" class="modal-source"></div>
        <div class="modal-actions">
            <button id="reRandomBtn" class="btn-ghost">🔄 再抽一个</button>
            <button id="watchInSiteBtn" class="btn-ghost">📺 站内播放</button>
            <button id="goWatchBtn" class="btn-primary">▶️ 跳转播放</button>
        </div>
    </div>
</div>

<!-- ========== 播放弹窗 ========== -->
<div id="videoModal" class="modal-overlay" style="display:none">
    <div class="modal-card modal-card-wide">
        <button class="modal-close" id="videoModalClose" aria-label="关闭">×</button>
        <div class="modal-header" id="videoModalTitle">视频标题</div>
        <div class="player-frame">
            <iframe id="videoPlayer" src="" frameborder="0"
                allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="modal-tip">点击空白处关闭 · 右下角可全屏</div>
        <div class="playlist-nav" id="playlistNav" style="display:none">
            <button id="plPrevBtn" class="btn-ghost">⏮ 上一条</button>
            <span id="plPosition" class="pl-position"></span>
            <button id="plNextBtn" class="btn-ghost">下一条 ⏭</button>
        </div>
        <!-- 相似推荐 -->
        <div class="similar-section" id="similarSection">
            <div class="similar-title">💡 听过这个的人也听</div>
            <div class="similar-list" id="similarList"></div>
        </div>
    </div>
</div>

<!-- ========== 播放列表抽屉 ========== -->
<div id="playlistDrawer" class="drawer-overlay" style="display:none">
    <aside class="drawer">
        <header class="drawer-header">
            <h2>📋 今晚序列</h2>
            <div class="drawer-actions">
                <button id="playlistPlayBtn" class="btn-primary sm">▶ 按序播放</button>
                <button id="playlistShuffleBtn" class="btn-ghost sm">🔀 随机</button>
                <button id="playlistClearBtn" class="btn-ghost sm">🗑 清空</button>
                <button id="playlistCloseBtn" class="btn-ghost sm">✕</button>
            </div>
        </header>
        <div id="playlistItems" class="drawer-body"></div>
        <footer class="drawer-tip">从卡片「＋」加入 · ↑↓ 调整顺序</footer>
    </aside>
</div>

<script src="user-data.js"></script>
<script src="main.js"></script>
<script>
// PWA Service Worker
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
            console.warn('Service Worker 注册失败:', err);
        });
    });
}
</script>
</body>
</html>
