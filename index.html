<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JY's ASMR</title>
    <link rel="stylesheet" href="style.css">
</head>    
<body>
<header class="page-header">
    <div class="container">
        <h1 class="site-title">JY's ASMR</h1>
        <div class="header-actions">
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="输入视频名称或标签搜索..."
                    autocomplete="off">
                
                <!-- 标签区域 -->
                <div class="tag-section" id="tagSection">
                    <div class="tag-header">
                        <span class="tag-title">🏷️ 热门标签</span>
                        <button id="tagToggleBtn" class="tag-toggle-btn">展开 ▼</button>
                    </div>
                    <div class="tag-cloud" id="tagCloud"></div>
                </div>
            </div>

            <!-- 排序选择 -->
            <div class="sort-group">
                <select id="sort-select">
                    <option value="date-desc">📅 最新优先</option>
                    <option value="date-asc">📅 最早优先</option>
                    <option value="name-asc">🔤 名称 A→Z</option>
                    <option value="name-desc">🔤 名称 Z→A</option>
                    <option value="random">🎲 随机</option>
                </select>
            </div>

            <button id="premiumFilterBtn" class="filter-btn">⚡ 充电专属</button>

            <!-- 收藏夹按钮 -->
            <button id="btn-favorites" class="filter-btn fav-btn" title="收藏夹">
                ⭐ 收藏 <span class="badge" id="fav-count" style="display:none">0</span>
            </button>

            <button id="randomBtn" class="random-btn">🎲 睡前抽一个</button>


        </div>
    </div>
</header>

    <main class="page-main">
        <div class="container">
            <!-- 统计栏 -->
            <div id="stats-bar" class="stats-bar">
                <span id="stats-text">正在加载视频数据...</span>
            </div>

            <div id="statusTip" class="status-tip">正在加载视频数据...</div>
            <div id="videoGrid" class="video-grid"></div>
            <!-- 分页控件 -->
            <div id="pagination" class="pagination" style="display: none;"></div>
        </div>
    </main>

    <!-- 随机视频弹窗 -->
    <div id="randomModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-close" id="modalClose">×</div>
            <div class="modal-header">✨ 为你挑选的睡前视频</div>
            <div id="modalVideoCover" class="modal-cover"></div>
            <div id="modalVideoTitle" class="modal-title"></div>
            <div class="modal-actions">
                <button id="reRandomBtn" class="btn-secondary">🔄 再抽一个</button>
                <button id="watchInSiteBtn" class="btn-secondary">📺 站内播放</button>
                <button id="goWatchBtn" class="btn-primary">▶️ 跳转B站</button>
            </div>
        </div>
    </div>

    <!-- B站视频播放弹框 -->
    <div id="videoModal" class="video-modal-overlay" style="display: none;">
        <div class="video-modal-content">
            <div class="video-modal-close" id="videoModalClose">×</div>
            <div class="video-modal-header" id="videoModalTitle">视频标题</div>
            <div class="video-player-wrapper">
               <iframe 
                    id="bilibiliPlayer" 
                    src="" 
                    frameborder="0" 
                    allow="autoplay; fullscreen"
                    scrolling="no"
                ></iframe>
            </div>
            <div class="video-modal-tip">点击空白处关闭弹框 | 右下角可全屏播放</div>
        </div>
    </div>

    <footer class="page-footer">
        <div class="container">
            <p>© JY's ASMR | 基于GitHub Pages构建</p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
